version: "1.0"
tests:
  # A版本接口 - 只保存响应体（自动格式化 JSON）
  - name: "A版本-用户查询"
    curl: 'curl -X POST https://httpbin.org/post -H "Content-Type: application/json" -d "{\"code\":200,\"msg\":\"success\",\"data\":{\"user_id\":123,\"username\":\"test\",\"email\":\"test@example.com\",\"created_at\":\"2024-01-01\"}}"'
    connections: 10
    duration: "5s"
    output_file: "results/response-a.json"
    output_response_only: true  # 只保存响应体，JSON 会自动格式化
    
  # B版本接口 - 只保存响应体（自动格式化 JSON）
  - name: "B版本-用户查询"
    curl: 'curl -X POST https://httpbin.org/post -H "Content-Type: application/json" -d "{\"code\":200,\"msg\":\"success\",\"data\":{\"user_id\":123,\"username\":\"test\",\"email\":\"test@example.com\",\"created_at\":\"2024-01-02\"}}"'
    connections: 10
    duration: "5s"
    output_file: "results/response-b.json"
    output_response_only: true  # 只保存响应体，JSON 会自动格式化

  # C版本接口 - 保存完整统计信息（默认行为）
  - name: "C版本-用户查询"
    curl: 'curl -X POST https://httpbin.org/post -H "Content-Type: application/json" -d "{\"code\":200,\"msg\":\"success\",\"data\":{\"user_id\":123,\"username\":\"test\"}}"'
    connections: 10
    duration: "5s"
    output_file: "results/full-stats-c.json"
    # output_response_only 默认为 false，保存完整统计信息

# JSON响应对比配置
jsondiff:
  pairs:
    - name: "A/B版本对比"
      base: "A版本-用户查询"
      target: "B版本-用户查询"
      compare_field: "json.data"
      ignore_fields:
        - "created_at"
