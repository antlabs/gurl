version: "1.0"
tests:
  # A版本接口（模拟旧版本API）
  - name: "A版本-用户查询"
    curl: 'curl -X POST https://httpbin.org/post -H "Content-Type: application/json" -d "{\"code\":200,\"msg\":\"success\",\"data\":{\"user_id\":123,\"username\":\"test\",\"email\":\"test@example.com\",\"created_at\":\"2024-01-01\"}}"'
    connections: 10
    duration: "5s"
    
  # B版本接口（模拟新版本API）
  - name: "B版本-用户查询"
    curl: 'curl -X POST https://httpbin.org/post -H "Content-Type: application/json" -d "{\"code\":200,\"msg\":\"success\",\"data\":{\"user_id\":123,\"username\":\"test\",\"email\":\"test@example.com\",\"created_at\":\"2024-01-02\"}}"'
    connections: 10
    duration: "5s"

# JSON响应对比配置
jsondiff:
  pairs:
    # 场景1: 只对比data字段（最常用）
    - name: "用户查询-只对比data"
      base: "A版本-用户查询"
      target: "B版本-用户查询"
      compare_field: "json.data"  # httpbin将请求体放在json字段，我们只对比其中的data
      ignore_fields:
        - "created_at"  # 忽略时间戳字段
    
    # 场景2: 对比整个code-msg-data结构
    - name: "用户查询-完整对比"
      base: "A版本-用户查询"
      target: "B版本-用户查询"
      compare_field: "json"  # 对比整个响应结构
      ignore_fields:
        - "data.created_at"  # 只忽略data下的created_at字段
